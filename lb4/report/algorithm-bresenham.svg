<text x="680.0" y="719.5" text-anchor="middle" fill="#172333" stroke="none" font-size="22">d = d + 4(x − y) + 10</text>
<text x="680.0" y="746.5" text-anchor="middle" fill="#172333" stroke="none" font-size="22">y = y − 1</text>
<rect x="230" y="850" width="240" height="50"/>
<text x="350.0" y="883.0" text-anchor="middle" fill="#172333" stroke="none" font-size="22">x = x + 1</text>
