<text x="350.0" y="393.5" text-anchor="middle" fill="#172333" stroke="none" font-size="22">Восемь симметричных точек;</text>
<text x="350.0" y="420.5" text-anchor="middle" fill="#172333" stroke="none" font-size="22">отбор по углам дуги; перенос,</text>
