<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1270" viewBox="0 0 900 1270">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#243449"/></marker></defs>
<rect width="900" height="1270" fill="white"/>
<g font-family="DejaVu Sans" font-size="22" stroke="#243449" stroke-width="2" fill="white">
<rect x="210" y="15" width="280" height="45" rx="22.5"/>
<text x="350.0" y="45.5" text-anchor="middle" fill="#172333" stroke="none" font-size="22">Начало: одна дуга</text>
<rect x="120" y="100" width="460" height="95"/>
<text x="350.0" y="142.0" text-anchor="middle" fill="#172333" stroke="none" font-size="22">N = max(1, ceil(R · β · π / 180))</text>
<text x="350.0" y="169.0" text-anchor="middle" fill="#172333" stroke="none" font-size="22">k = 0</text>
<path d="M350.0 240L480 290.0L350.0 340L220 290.0Z"/>
<text x="350.0" y="298.0" text-anchor="middle" fill="#172333" stroke="none" font-size="22">k ≤ N?</text>
<rect x="120" y="385" width="460" height="100"/>
<text x="350.0" y="416.0" text-anchor="middle" fill="#172333" stroke="none" font-size="22">t = (α + β · k / N) · π / 180</text>
<text x="350.0" y="443.0" text-anchor="middle" fill="#172333" stroke="none" font-size="22">x = round(cx + R cos t)</text>
<text x="350.0" y="470.0" text-anchor="middle" fill="#172333" stroke="none" font-size="22">y = round(cy + R sin t)</text>
<path d="M350.0 530L480 580.0L350.0 630L220 580.0Z"/>
<text x="350.0" y="588.0" text-anchor="middle" fill="#172333" stroke="none" font-size="22">k = 0?</text>
<rect x="80" y="690" width="340" height="75"/>
<text x="250.0" y="735.5" text-anchor="middle" fill="#172333" stroke="none" font-size="22">Записать первый пиксель</text>
<rect x="500" y="690" width="360" height="100"/>
<text x="680.0" y="721.0" text-anchor="middle" fill="#172333" stroke="none" font-size="22">Соединить предыдущий</text>
<text x="680.0" y="748.0" text-anchor="middle" fill="#172333" stroke="none" font-size="22">и текущий пиксели</text>
<text x="680.0" y="775.0" text-anchor="middle" fill="#172333" stroke="none" font-size="22">целочисленным отрезком</text>
<rect x="120" y="865" width="460" height="75"/>
<text x="350.0" y="897.0" text-anchor="middle" fill="#172333" stroke="none" font-size="22">Запомнить текущий пиксель;</text>
<text x="350.0" y="924.0" text-anchor="middle" fill="#172333" stroke="none" font-size="22">k = k + 1</text>
<rect x="230" y="1160" width="240" height="45" rx="22.5"/>
<text x="350.0" y="1190.5" text-anchor="middle" fill="#172333" stroke="none" font-size="22">Конец</text>
<polyline points="350,60 350,100" fill="none" marker-end="url(#arrow)"/>
<polyline points="350,195 350,240" fill="none" marker-end="url(#arrow)"/>
<polyline points="350,340 350,385" fill="none" marker-end="url(#arrow)"/>
<polyline points="350,485 350,530" fill="none" marker-end="url(#arrow)"/>
<text x="390" y="367" text-anchor="middle" fill="#172333" stroke="none" font-size="20">Да</text>
<polyline points="220,580 60,580 60,727 80,727" fill="none" marker-end="url(#arrow)"/>
<text x="175" y="610" text-anchor="middle" fill="#172333" stroke="none" font-size="20">Да</text>
<polyline points="480,580 680,580 680,690" fill="none" marker-end="url(#arrow)"/>
<text x="540" y="565" text-anchor="middle" fill="#172333" stroke="none" font-size="20">Нет</text>
<polyline points="250,765 250,820 350,820 350,865" fill="none" marker-end="url(#arrow)"/>
<polyline points="680,790 680,820 350,820" fill="none" marker-end="url(#arrow)"/>
<polyline points="120,902 40,902 40,290 220,290" fill="none" marker-end="url(#arrow)"/>
<polyline points="480,290 880,290 880,1182 470,1182" fill="none" marker-end="url(#arrow)"/>
<text x="540" y="275" text-anchor="middle" fill="#172333" stroke="none" font-size="20">Нет</text></g></svg>