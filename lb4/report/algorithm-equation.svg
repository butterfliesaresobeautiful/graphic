<rect x="230" y="895" width="240" height="50"/>
<text x="350.0" y="928.0" text-anchor="middle" fill="#172333" stroke="none" font-size="22">x = x + 1</text>
<rect x="120" y="1030" width="460" height="65"/>
<text x="350.0" y="1070.5" text-anchor="middle" fill="#172333" stroke="none" font-size="22">Добавить концы неполной дуги</text>
