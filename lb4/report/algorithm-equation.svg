<text x="350.0" y="656.0" text-anchor="middle" fill="#172333" stroke="none" font-size="22">Восемь симметричных точек;</text>
<text x="350.0" y="683.0" text-anchor="middle" fill="#172333" stroke="none" font-size="22">оставить точки в углах дуги;</text>
<text x="350.0" y="710.0" text-anchor="middle" fill="#172333" stroke="none" font-size="22">перенести к центру и округлить</text>
